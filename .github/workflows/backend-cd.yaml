name: Backend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - starter/backend/**
      - .github/workflows/backend-cd.yaml
      - .github/actions/setup-backend/**
      - .github/scripts/smoke-test.sh
  workflow_dispatch:

# Queue deployments instead of cancelling them: killing a run halfway through
# `kubectl apply` could leave the cluster half-updated.
concurrency:
  group: backend-cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  ECR_REPOSITORY: backend

defaults:
  run:
    working-directory: starter/backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python, restore pipenv cache, install dependencies
        uses: ./.github/actions/setup-backend

      - name: Run flake8
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python, restore pipenv cache, install dependencies
        uses: ./.github/actions/setup-backend

      - name: Run pytest
        run: pipenv run test

  build:
    name: Build and push image to ECR
    runs-on: ubuntu-latest
    # Gate: nothing reaches ECR unless lint and tests passed.
    needs: [lint, test]
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image name
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        # The git SHA tag ties every running pod back to the exact commit that built it.
        run: echo "image=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image (with GitHub Actions layer cache)
        uses: docker/build-push-action@v7
        with:
          context: starter/backend
          push: true
          tags: ${{ steps.image.outputs.image }}
          # EKS nodes are x86_64 (t3.small); pin the platform so the image always matches.
          platforms: linux/amd64
          # Without this, Buildx adds a provenance attestation that ECR lists as an extra untagged "image".
          provenance: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: backend-production
      url: ${{ steps.smoke.outputs.url && format('{0}/movies', steps.smoke.outputs.url) || '' }}
    outputs:
      url: ${{ steps.smoke.outputs.url }}
    defaults:
      run:
        working-directory: starter/backend/k8s
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Ensure kustomize is installed
        run: |
          if ! command -v kustomize >/dev/null; then
            echo "[deploy] kustomize not found on runner; installing"
            curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.3 /usr/local/bin
          fi
          kustomize version

      - name: Point manifests at the new image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        # This edits kustomization.yaml on the runner only; it is never committed.
        run: kustomize edit set image "backend=${IMAGE}"

      - name: Apply manifests
        id: apply
        run: kustomize build | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/backend --timeout=180s

      - name: Smoke test GET /movies
        id: smoke
        working-directory: .
        run: bash .github/scripts/smoke-test.sh backend

      - name: Roll back on failure
        # Only undo if this run actually changed the Deployment.
        if: failure() && steps.apply.outcome == 'success'
        run: |
          echo "::warning::[deploy] Rollout or smoke test failed; rolling back to the previous ReplicaSet"
          kubectl rollout undo deployment/backend
          kubectl rollout status deployment/backend --timeout=180s

  notify:
    name: Notify
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build, deploy]
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RESULT: ${{ needs.deploy.result }}
      IMAGE: ${{ needs.build.outputs.image }}
      URL: ${{ needs.deploy.outputs.url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Write job summary
        run: |
          {
            echo "### Backend deployment: ${RESULT}"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Test | ${{ needs.test.result }} |"
            echo "| Build & push | ${{ needs.build.result }} |"
            echo "| Deploy & smoke test | ${RESULT} |"
            echo "| Image | \`${IMAGE:-n/a}\` |"
            echo "| URL | ${URL:+${URL}/movies} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Slack notification
        # Optional: only runs when the SLACK_WEBHOOK_URL secret is configured.
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          if [[ "$RESULT" == "success" ]]; then emoji=":white_check_mark:"; else emoji=":x:"; fi
          text="${emoji} Backend deploy *${RESULT}* for \`${GITHUB_SHA::7}\` by ${GITHUB_ACTOR}. <${RUN_URL}|View run>"
          [[ -n "$URL" ]] && text="${text} · <${URL}/movies|/movies>"
          payload=$(jq -n --arg text "$text" '{text: $text}')
          curl --silent --show-error --fail -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" \
            || echo "::warning::[notify] Slack notification failed"
